# 12U science-first multi-payload science observatory (Earth + space). Values are engineering estimates, to be refined.

[platform]
name = "12U science-first observatory"
units = 12
mass_limit_kg = 24.0

[orbit]
altitude_km = 500
sunlit_fraction = 0.62          # ~35 min eclipse of ~95 min

[solar]
flux_w_m2 = 1361
cell_efficiency = 0.28          # triple-junction, beginning of life
packing_factor = 0.85
cell_area_m2 = 0.50             # body + deployable wings
eps_efficiency = 0.90
degradation = 0.90              # end-of-life factor

[geometry]
envelope_cm3 = 17435          # 226.3 x 226.3 x 340.5 mm
structure_fraction = 0.12    # walls, rails, brackets
packing_efficiency = 0.70    # routing, keep-outs, thermal paths, PCB gaps
# 12U envelope 226.3 x 226.3 x 340.5 mm. Cell areas are the physical faces; usable fractions
# account for cut-outs (telescope, antennas, sensors, radiators).
large_face_m2 = 0.0770      # 226 x 340, two of them
narrow_face_m2 = 0.0771     # 226 x 340 (12U has four large long faces)
end_face_m2 = 0.0512        # 226 x 226, two of them (nadir/zenith)
body_usable_fraction = 0.65
wings = 2
panels_per_wing = 3         # stowed-thickness check against CDS protrusion limit still open
wing_panel_m2 = 0.0770      # 226 x 340, single-sided cells
wing_usable_fraction = 0.90

# body_proj / wing_proj: average fraction of that cell area effectively lit while sunlit.
# Convex tumbling body: 0.25. Sun-facing plate: ~1.0.
[[scenario]]
name = "Typical LEO, ADCS sun-biased (NOMINAL)"
body_proj = 0.25
wing_proj = 0.70
sunlit = 0.62
nominal = true

[[scenario]]
name = "Typical LEO, tumbling, wings deployed"
body_proj = 0.25
wing_proj = 0.25
sunlit = 0.62

[[scenario]]
name = "Dawn-dusk SSO, nadir pointing, wings face sun"
body_proj = 0.30
wing_proj = 0.95
sunlit = 0.98

[[scenario]]
name = "SAFE MODE: tumbling, wings failed to deploy"
body_proj = 0.25
wing_proj = 0.0
sunlit = 0.62
safe = true

[[scenario]]
name = "BURN MODE: minimal services + electric thruster (sunlit only)"
body_proj = 0.25
wing_proj = 0.70
sunlit = 0.62
safe = true
extra_load_w = 50.0
extra_sunlit_only = true

[battery]
capacity_wh = 84
specific_energy_wh_kg = 110   # LiFePO4 pack level, hard-case cells
max_depth_of_discharge = 0.4

# Each module: mass, average power when active, duty (0-1), payload flag.
