# 12U internal layout: 2 x 2 x 3 cell grid.
# Columns Q1..Q4 run around the cross-section (ring order Q1-Q2-Q3-Q4-Q1).
# Decks D1 (nadir end) .. D3 (zenith end). A module is placed as "Qn/d" or "Qn/d1-d2"
# (spread evenly over the listed decks). "skin" = outer solar/panel layer, "spine" = central
# backplane channel, "structure" = frame itself.

[grid]
columns = 4
decks = 3

# NOTE: assignments below were reconciled with the real geometric packing (mechanical/pack.py).
# Q1  telescope column (Earth-facing optics, thermally quiet, opposite the compute column)
# Q2  attitude + propulsion + small Earth optics
# Q3  compute + comms (hot, EMI) at the nadir end, quiet space-science sensors at the zenith end
# Q4  energy vault (packs A/B/C in separate decks) + hard-radiation science

[[place]]
match = "Payload E: telescope"
at = "Q1/1-3"
pack = "sequential"   # tube fills D1, D2, then the tip of D3
[[place]]
match = "EO: hyperspectral"
at = "Q1/3"

