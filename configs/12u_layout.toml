# ---- separation rules ----
# kinds: different_column, different_deck, opposite_column (ring distance 2), not_adjacent

[[rule]]
why = "magnetometer far from batteries (currents)"
a = "SCI: deployable magnetometer boom"
b = "LiFePO4 pack A"
kind = "different_column"

[[rule]]
why = "magnetometer far from reaction wheels"
a = "SCI: deployable magnetometer boom"
b = "ADCS:"
kind = "different_column"

[[rule]]
why = "VLF receiver away from hot, noisy compute"
a = "SCI: VLF"
b = "Mission computer: Jetson"
kind = "different_deck"

[[rule]]
why = "telescope opposite the hottest compute (thermal distortion)"
a = "Payload E: telescope"
b = "Mission computer: Jetson"
kind = "opposite_column"

[[rule]]
why = "batteries not in the telescope column"
a = "Payload E: telescope"
b = "LiFePO4 pack A"
kind = "different_column"

[[rule]]
why = "propellant not next to batteries"
a = "Bus: micro-propulsion"
b = "LiFePO4 pack A"
kind = "different_column"

[[rule]]
why = "compute not in the battery column"
a = "Mission computer: Jetson"
b = "LiFePO4 pack A"
kind = "different_column"

[[rule]]
why = "survival pack C separate deck from pack A"
a = "LiFePO4 pack C"
b = "LiFePO4 pack A"
kind = "different_deck"

[[rule]]
why = "survival pack C separate deck from pack B"
a = "LiFePO4 pack C"
b = "LiFePO4 pack B"
kind = "different_deck"

[[rule]]
why = "pack A and pack B separate decks"
a = "LiFePO4 pack A"
b = "LiFePO4 pack B"
kind = "different_deck"

