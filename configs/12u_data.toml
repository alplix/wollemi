# Imaging is a campaign: image counts are chosen to fill leftover capacity.
[imaging.telescope]
raw_mb_per_image = 18
ratio = 8
[imaging.hyperspectral]
raw_mb_per_scene = 384          # ~100 km strip, 1024 px x 50 bands x 12 bit
ratio = 8

[storage]
devices = 8                   # eMMC / SLC-NAND modules on the mass memory unit
gb_each = 128
parity = 2                    # 6+2 erasure coding: any two devices may fail
raw_ring_gb = 300             # rolling buffer of raw data
imaging_telescope_per_day = 50
imaging_hyperspectral_per_day = 2
device_failure_per_year = 0.03
