# Science data streams and downlink assumptions for the 12U observatory.
# raw_mb_day = raw production per day; ratio = compression achieved; priority 1 = must reach ground.
# All values are engineering estimates, to be refined with real instrument designs.

[link]
sband_rate_bps = 1_000_000        # amateur S-band 2.4 GHz, volunteer stations with ~1-2 m dishes
link_efficiency = 0.65            # framing, retransmissions, Doppler/tracking losses
pass_s = 447                      # average usable seconds per pass (Pamukkale, 700 km dawn-dusk SSO, elevation > 10 deg)
passes_per_station_day = 3.7    # reference site Pamukkale, dawn-dusk orbit (groundstation/predict.py: 3.7/day, 28 min/day)
uhf_rate_bps = 5_000              # LoRa
uhf_efficiency = 0.5
ota_reserve_mb_day = 5            # software updates and command uploads (uplink side, tracked here)

[[scenario]]
name = "1 S-band station"
stations = 1
[[scenario]]
name = "3 S-band stations"
stations = 3
[[scenario]]
name = "10 S-band stations (volunteer network)"
stations = 10

# chain: long = must survive loss of the Linux computers (acquire on the flight controller "fc" or "supervisor"); heavy = may use the Pi/Jetson.
# checked by sim/chain_check.py (requirement LONG-2)
[[stream]]
name = "Housekeeping telemetry"
chain = "long"
acquire = "fc"
path = ["fc", "mmu", "radio"]
raw_mb_day = 17.3
ratio = 10
priority = 1
