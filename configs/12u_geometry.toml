# Geometry for the 12U CAD model (all lengths in mm).
# size = [dx, dy, dz] bounding box of the module (dz along the long nadir-zenith axis).
# fixed = true keeps the orientation; shape = "cyl" builds a cylinder along z inside the box.
# Matching is by module-name prefix. Sizes are design-level estimates from typical hardware
# and are meant to be replaced by vendor CAD as parts are chosen.

# notched = true: card format with the 20 x 20 mm corner cut-out that clears the central spine;
# such a card is anchored at the spine corner of its column.
# end = "nadir" / "zenith": the module must sit against that end plate (windows, apertures, antennas).

[frame]
outer = [226.3, 226.3, 340.5]   # 12U envelope
wall = 3.0                       # outer wall thickness (Al)
cross = 3.0                      # cross bulkhead thickness (splits the interior into 4 columns)
spine = 40.0                     # central spine square (backplane channel)
rail = 8.5                       # corner rail cross-section
voxel = 2.5                      # packing resolution (sizes are rounded up: built-in clearance)
protrusion_limit = 6.5           # allowed protrusion beyond the rail plane (verify with the dispenser)

[wings]
count = 2
panels_per_wing = 3
panel = [226.3, 340.5, 2.1]      # width, length, thickness (PCB + cells); 3 stowed must stay <= protrusion_limit
standoff = 6.5                   # hinge offset of the deployed wing plane from the rail plane

