# Rough cost model (USD). ALL VALUES ARE UNVERIFIED ORDER-OF-MAGNITUDE ESTIMATES made without vendor quotes; treat each as +-2x.
# Every item is a triangular distribution (low, likely, high). group: bus / science / optional / ground / launch / programme.
# scope: "flight" = only needed for a flight model; "both" = also needed for a FlatSat (engineering models).
# tier: which scenario includes it: "core" (bus + long-life science), "imaging" (telescope, cameras, hyperspectral), "extra" (outreach and research instruments).

[assumptions]
person_year_usd = 90000          # loaded cost of a professional engineer-year (labour value; volunteer labour is not cash)
engineer_days_per_year = 220
contingency_hardware = 0.30      # applied to hardware groups
contingency_other = 0.15
flatsat_fraction_of_core_hardware = 0.40     # engineering models for the FlatSat, as a fraction of the core electronics hardware
balloon_flight_usd = [8000, 15000, 30000]
external_cost_per_test_day = { none = 0, low = 400, medium = 1500, high = 4000 }   # USD per engineer-day of test campaign in outside facilities
monte_carlo_samples = 20000
monte_carlo_seed = 7

