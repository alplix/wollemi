# 3U multi-payload science observatory (Earth + space). Values are engineering estimates, to be refined.

[platform]
name = "3U science observatory"
units = 3
mass_limit_kg = 4.0

[orbit]
altitude_km = 500
sunlit_fraction = 0.62          # ~35 min eclipse of ~95 min

[solar]
flux_w_m2 = 1361
cell_efficiency = 0.28          # triple-junction, beginning of life
packing_factor = 0.85
cell_area_m2 = 0.24             # body + deployable wings
avg_projection = 0.55           # ADCS gives partial sun pointing
eps_efficiency = 0.90
degradation = 0.90              # end-of-life factor

[battery]
capacity_wh = 60
specific_energy_wh_kg = 200
max_depth_of_discharge = 0.4

# Each module: mass, average power when active, duty (0-1), payload flag.
[[module]]
name = "Structure + rails"
mass_kg = 0.42
power_w = 0.0
duty = 1.0
payload = false

