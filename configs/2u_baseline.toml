# Baseline 2U configuration. Values are engineering estimates, to be refined.

[platform]
name = "2U baseline"
units = 2
mass_limit_kg = 2.66

[orbit]
altitude_km = 500
sunlit_fraction = 0.62          # ~35 min eclipse of ~95 min

[solar]
flux_w_m2 = 1361
cell_efficiency = 0.28          # triple-junction, beginning of life
packing_factor = 0.85
cell_area_m2 = 0.10             # body + deployable wings
avg_projection = 0.35           # 0.25 tumbling, ~0.6+ with sun pointing
eps_efficiency = 0.90
degradation = 0.90              # end-of-life factor

[battery]
capacity_wh = 30
specific_energy_wh_kg = 200
max_depth_of_discharge = 0.4

# Each module: mass, average power when active, duty (0-1), payload flag.
[[module]]
name = "Structure + rails"
mass_kg = 0.28
power_w = 0.0
duty = 1.0
payload = false

